<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Administración | Fit Progress{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: light; font-family: "DM Sans", sans-serif; color: #172424; background: #f0f3f1; --ink: #172424; --muted: #647270; --line: #d3dcda; --paper: #fff; --hot: #df5637; --teal: #11776f; --soft: #e5eeeb; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; grid-template-columns: 238px minmax(0, 1fr); }
        a { color: inherit; }
        .rail { display: flex; flex-direction: column; min-height: 100vh; padding: 26px 18px; background: var(--ink); color: #f7faf8; border-right: 5px solid var(--hot); }
        .brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 32px; text-decoration: none; font-size: .82rem; font-weight: 700; }
        .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; background: var(--hot); color: white; font: 800 1rem "Barlow Condensed", sans-serif; }
        .brand strong { color: #84d1c5; }
        .rail-label { margin: 14px 8px 8px; color: #9caaa7; font-size: .64rem; font-weight: 700; text-transform: uppercase; }
        .rail-link { display: flex; align-items: center; min-height: 42px; margin: 2px 0; padding: 0 10px; border-left: 3px solid transparent; color: #e1e9e6; text-decoration: none; font-size: .84rem; }
        .rail-link:hover, .rail-link[aria-current="page"] { border-left-color: var(--hot); background: #263838; color: white; }
        .rail-foot { margin-top: auto; padding: 18px 8px 0; border-top: 1px solid #354442; color: #c2ceca; font-size: .76rem; overflow-wrap: anywhere; }
        .shell { min-width: 0; }
        .topline { display: flex; justify-content: space-between; align-items: center; gap: 20px; min-height: 64px; padding: 12px clamp(18px, 4vw, 56px); border-bottom: 1px solid var(--line); background: var(--paper); }
        .crumb { color: var(--muted); font-size: .68rem; font-weight: 700; text-transform: uppercase; }
        .top-user { display: flex; align-items: center; gap: 14px; font-size: .78rem; font-weight: 700; }
        .logout { border: 0; border-bottom: 1px solid var(--hot); padding: 5px 0; background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
        .content { width: min(1320px, 100%); margin: 0 auto; padding: 34px clamp(18px, 4vw, 56px) 60px; }
        .eyebrow { color: var(--teal); font-size: .68rem; font-weight: 700; text-transform: uppercase; }
        h1, h2, h3 { margin: 0; color: var(--ink); font-family: "Barlow Condensed", sans-serif; text-transform: uppercase; }
        h1 { margin-top: 6px; font-size: 2.65rem; line-height: 1; }
        h2 { font-size: 1.55rem; line-height: 1.05; }
        p { line-height: 1.5; }
        .heading { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 26px; }
        .heading p { margin: 8px 0 0; color: var(--muted); font-size: .88rem; }
        .button { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 0 15px; border: 0; background: var(--hot); color: white; font: 700 .74rem "DM Sans", sans-serif; text-decoration: none; text-transform: uppercase; cursor: pointer; }
        .button:hover { background: #bd4129; }
        .button.secondary { background: var(--ink); }
        .metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 26px 0 34px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--paper); }
        .metric { min-width: 0; padding: 18px 20px; border-right: 1px solid var(--line); }
        .metric:last-child { border-right: 0; }
        .metric-label { display: block; color: var(--muted); font-size: .65rem; font-weight: 700; text-transform: uppercase; }
        .metric-value { display: block; margin-top: 8px; font: 800 2.25rem/.95 "Barlow Condensed", sans-serif; }
        .section-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 14px; }
        .table-wrap { overflow-x: auto; border-top: 2px solid var(--ink); background: var(--paper); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 13px 15px; border-bottom: 1px solid var(--line); vertical-align: middle; }
        th { color: var(--muted); font-size: .64rem; font-weight: 700; text-transform: uppercase; }
        td { font-size: .82rem; }
        tbody tr:hover { background: #f4f8f6; }
        .row-link { color: var(--teal); font-weight: 700; text-decoration-thickness: 1px; text-underline-offset: 3px; }
        .status { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
        .status::before { width: 8px; height: 8px; background: #b0bfbb; content: ""; }
        .status.active::before { background: var(--teal); }
        .status.staff::before { background: var(--hot); }
        .filters { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; margin-bottom: 18px; padding: 16px; border: 1px solid var(--line); background: var(--paper); }
        .field { min-width: 180px; flex: 1 1 240px; }
        label { display: block; margin-bottom: 6px; color: var(--muted); font-size: .68rem; font-weight: 700; text-transform: uppercase; }
        input, select { width: 100%; min-height: 42px; border: 1px solid #bdcbc7; border-radius: 0; padding: 9px 11px; background: white; color: var(--ink); font: .88rem "DM Sans", sans-serif; }
        input:focus, select:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
        .form-layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(230px, .7fr); gap: 24px; align-items: start; }
        .form-section { padding: 20px; border-top: 2px solid var(--ink); background: var(--paper); }
        .form-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; margin-top: 18px; }
        .form-fields .field { min-width: 0; }
        .form-fields .wide { grid-column: 1 / -1; }
        .flags { display: grid; gap: 10px; margin: 18px 0; }
        .flag { display: flex; align-items: center; gap: 10px; margin: 0; color: var(--ink); font-size: .82rem; text-transform: none; }
        .flag input, .group-list input { width: 18px; min-height: 18px; margin: 0; accent-color: var(--teal); }
        .group-list { display: grid; gap: 8px; margin: 8px 0 0; padding: 0; list-style: none; }
        .group-list label { display: flex; align-items: center; gap: 9px; margin: 0; color: var(--ink); font-size: .82rem; text-transform: none; }
        .errors { color: #a43023; font-size: .76rem; }
        .errors ul { margin: 5px 0; padding-left: 18px; }
        .help { margin: 6px 0 0; color: var(--muted); font-size: .72rem; }
        .form-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 22px; }
        .pagination { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 16px; color: var(--muted); font-size: .78rem; }
        .message { margin-bottom: 18px; padding: 12px 14px; border-left: 4px solid var(--teal); background: var(--soft); font-size: .84rem; }
        .empty { padding: 24px 15px; color: var(--muted); }
        @media (max-width: 820px) { body { grid-template-columns: 1fr; } .rail { min-height: auto; padding: 14px 18px; border-right: 0; border-bottom: 4px solid var(--hot); } .brand { padding: 2px 4px 12px; } .rail-label, .rail-foot { display: none; } .rail-links { display: flex; gap: 4px; overflow-x: auto; } .rail-link { flex: 0 0 auto; min-height: 38px; } .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } .metric:nth-child(2) { border-right: 0; } .metric:nth-child(-n+2) { border-bottom: 1px solid var(--line); } .form-layout { grid-template-columns: 1fr; } }
        @media (max-width: 520px) { .topline { align-items: flex-start; } .content { padding-top: 24px; } .heading { align-items: flex-start; flex-direction: column; } .metrics { margin-top: 18px; } .metric { padding: 14px; } .metric-value { font-size: 1.9rem; } .form-fields { grid-template-columns: 1fr; } .form-fields .wide { grid-column: auto; } th, td { padding: 11px 10px; } }
    </style>
</head>
<body>
    <aside class="rail">
        <a class="brand" href="{% url 'panel_admin:inicio' %}"><span class="brand-mark">FP</span><span>FIT <strong>PROGRESS</strong><br>OPERACIONES</span></a>
        <div class="rail-label">Gestión</div>
        <nav class="rail-links" aria-label="Administración">
            <a class="rail-link" href="{% url 'panel_admin:inicio' %}"{% if request.resolver_match.url_name == 'inicio' %} aria-current="page"{% endif %}>Resumen</a>
            <a class="rail-link" href="{% url 'panel_admin:usuarios' %}"{% if request.resolver_match.url_name == 'usuarios' or request.resolver_match.url_name == 'usuario_nuevo' or request.resolver_match.url_name == 'usuario_editar' %} aria-current="page"{% endif %}>Usuarios</a>
        </nav>
        <div class="rail-foot">Panel de gestión<br>Acceso restringido</div>
    </aside>
    <div class="shell">
        <header class="topline"><span class="crumb">Fit Progress / Administración</span><div class="top-user"><span>{{ request.user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="logout" type="submit">Salir</button></form></div></header>
        <main class="content">
            {% for message in messages %}<div class="message" role="status">{{ message }}</div>{% endfor %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
